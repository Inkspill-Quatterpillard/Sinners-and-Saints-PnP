# Baut die Charakter-App (app/) und veröffentlicht sie auf GitHub Pages.
# Voraussetzung im Repo: Settings → Pages → Source „GitHub Actions“.
name: Charakter-App auf GitHub Pages

on:
  push:
    branches: [main, charakter-app]
    paths: ['app/**', 'Regelwerk/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check-rules
      - name: Build
        run: npm run build
        env:
          # Die Seite liegt unter https://<owner>.github.io/<repo>/
          BASE_PATH: /${{ github.event.repository.name }}
      # GitHub Pages liefert für unbekannte Pfade 404.html aus; so übernimmt die App das Routing.
      - run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
